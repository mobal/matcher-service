services:
  app:
    build: .
    command: >-
      sh -c "uv run --no-dev alembic upgrade head &&
      uv run --no-dev uvicorn app.api_handler:app --host 0.0.0.0 --port 8080"
    env_file:
      - .env.local
    environment:
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
