services:
  wiremock:
    image: wiremock/wiremock:3.13.2-alpine
    command: --port 8080
    volumes:
      - ./mocks/external/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  init:
    build: .
    command: uv run --no-dev python -m scripts.init_test_data
    environment:
      DATABASE_PATH: /data/matcher-service.sqlite3
      AUTH_JWT_SECRET: local-newman-secret-that-is-at-least-32-bytes
      AUTH_JWT_ISSUER: dev-auth-service
      AUTH_JWT_AUDIENCE: https://dev-matcher-service
      OMDB_API_URL: http://wiremock:8080/omdb
      OMDB_API_KEY: local-omdb-key
    volumes:
      - database:/data
    depends_on:
      wiremock:
        condition: service_healthy

  app:
    build: .
    command: uv run --no-dev uvicorn app.api_handler:app --host 0.0.0.0 --port 8080
    environment:
      DATABASE_PATH: /data/matcher-service.sqlite3
      AUTH_JWT_SECRET: local-newman-secret-that-is-at-least-32-bytes
      AUTH_JWT_ISSUER: dev-auth-service
      AUTH_JWT_AUDIENCE: https://dev-matcher-service
      OMDB_API_URL: http://wiremock:8080/omdb
      OMDB_API_KEY: local-omdb-key
    volumes:
      - database:/data
    depends_on:
      init:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  newman:
    image: postman/newman:alpine
    command: >-
      run /etc/postman/matcher-service.postman_collection.json
      --environment /etc/postman/matcher-service.postman_environment.json
      --env-var baseUrl=http://app:8080
      --bail
    volumes:
      - ./postman/matcher-service.postman_collection.json:/etc/postman/matcher-service.postman_collection.json:ro
      - ./postman/matcher-service.postman_environment.json:/etc/postman/matcher-service.postman_environment.json:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  database:
