name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run security scanner
        run: uv run python -m bandit --severity-level medium --confidence-level high -r app/

      - name: Run linter and formatter check
        run: |
          uv run ruff check app/ tests/
          uv run ruff format --check app/ tests/

      - name: Run unit and integration tests
        env:
          DEBUG: "false"
        run: uv run pytest tests/

  newman:
    name: Docker end-to-end (Newman)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Postman collection in Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from newman newman

      - name: Clean up containers
        if: always()
        run: docker compose down -v --remove-orphans
