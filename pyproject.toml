[project]
name = "matcher-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.128.6",
    "httpx2>=2.13.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.0",
    "httpx2-pytest>=0.34.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0",
    "ty>=0.0.1",
]


[tool.pytest.ini_options]
addopts = "--cache-clear -n auto -r f"

pythonpath = [
    ".",
    "app",
]
testpaths = [
    "tests"
]
